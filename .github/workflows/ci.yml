name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un nouveau push annule les vérifications encore en cours sur la même branche ou PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pas de hooks Git en CI (Husky) : `npm ci` n'a rien à installer dans .git.
  HUSKY: 0

jobs:
  verifier:
    name: Lint, types, format, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Navigateur de la version de @playwright/test du lockfile (pas de chemin local).
      - run: npx playwright install --with-deps chromium

      # Le webServer de playwright.config.ts construit l'app puis lance `vite preview`.
      - run: npm run e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
