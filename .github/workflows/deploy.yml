name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; celui en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # `base: '/nutry/'` est fixé dans vite.config.ts : https://<compte>.github.io/nutry/
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
