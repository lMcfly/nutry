<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP : tout vient de l'app elle-même, aucun script ni style en ligne, aucune connexion
      tierce. Seule exception : les photos de certains plats, des images (img-src) chargées
      depuis le CDN d'Unsplash (ADR 0014) ; les vidéos d'exercices sont auto-hébergées
      (media-src 'self', ADR 0015). Retirée par vite.config.ts en `npm run dev` seulement (préambule React Refresh
      en ligne) ; le build et `vite preview` l'appliquent. Voir docs/DEPLOIEMENT.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Nutry</title>
    <meta
      name="description"
      content="Nutry t’aide à rééquilibrer ton alimentation en douceur : menus de la semaine, liste de courses et quiz. Tout reste sur ton appareil."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#3d6b4f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nutry" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <noscript>
      <p>Nutry a besoin de JavaScript pour fonctionner. Active-le puis recharge la page.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service worker : fichier séparé, la CSP interdit les scripts en ligne. -->
    <script type="module" src="/src/infrastructure/pwa/register.ts"></script>
  </body>
</html>
